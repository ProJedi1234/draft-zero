# compose.editswitch.yaml — the editor say/do switcher branch, up on its own so
# re-voicing an existing turn can be tried beside whatever else runs on this box.
#
#   docker compose -f compose.editswitch.yaml up -d --build
#   docker compose -f compose.editswitch.yaml down -v
#
# Its own project name, volume and ports. `docker ps -a` is the register and it
# is the only trustworthy one — the allocated pairs at the time of writing ran
# up to `draft-zero-summary` (5444/3013), `draft-zero-spacefix` (5446/3015) and
# `draft-zero-memwindow` (5447/3016), several merely stopped rather than gone.
# Check at `up` time rather than trusting this list.
#
# 3017 binds to 0.0.0.0 so the demo is reachable from a phone or an iPad.
name: draft-zero-editswitch

services:
  postgres:
    # 17, matching the base stack: this database is seeded from the repo's own
    # mock fixtures, not copied from devpg, so there is no 18 dump to read.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5448:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # The demonstration data. `db:seed` is DESTRUCTIVE — it wipes every table
  # before inserting the fixtures — which is safe here and nowhere else: the
  # DATABASE_URL below names this stack's own postgres service, backed by this
  # file's own named volume, created empty by `up`. It is not devpg (5432) and
  # not the base stack (5433).
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Deliberately empty: an empty key drops generation to the offline mock.
      # This branch is about editing turns that already exist — flipping a Say
      # to a Do re-runs the pure translator, and no part of that is billed.
      OPENROUTER_API_KEY: ""
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3017:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
