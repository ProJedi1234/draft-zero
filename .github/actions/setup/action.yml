# .github/actions/setup/action.yml — Everything both CI jobs need before they
# can run a script: the right Bun, and node_modules.
#
# This lives in a composite action rather than being copy-pasted into each job
# because the two copies would drift, and a job silently installing against a
# different Bun than the other is the kind of CI bug that costs an afternoon.

name: Set up Bun and install dependencies
description: Pins Bun to .bun-version, restores the module cache, installs from bun.lock.

runs:
  using: composite
  steps:
    # setup-bun caches the Bun binary itself by default, so this is a download
    # only on the first run for a given version.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    # Bun's global package cache. `bun install` is already fast (sub-second
    # warm, a few seconds cold), so this is worth less than it looks — its real
    # value is not depending on npm being up.
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        # A stale cache still holds most of the 652 packages when one dependency
        # moves, so a partial hit beats a cold install.
        restore-keys: bun-install-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash
