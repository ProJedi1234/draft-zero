# compose.reorderprofiles.yaml — the reorder-profiles branch, up on its own so
# the settings list can be dragged around beside whatever else is running.
#
#   docker compose -f compose.reorderprofiles.yaml up -d --build
#   docker compose -f compose.reorderprofiles.yaml down -v
#
# Its own project name, volume and ports; 5437/3005 were free at `up` time
# (freed when the imageusage stack came down). 3005 binds 0.0.0.0 for phone
# testing — drag and drop is exactly the kind of thing that behaves differently
# under a finger than a mouse.
name: draft-zero-reorderprofiles

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # `db:seed` is DESTRUCTIVE — safe only because this DATABASE_URL names this
  # file's own postgres service, backed by this file's own named volume. Not
  # devpg (5432), not the base stack (5433).
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Reordering a list touches no model — no key, and generation drops to
      # the offline mock. Nothing is billed.
      OPENROUTER_API_KEY: ""
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3005:3000"
    volumes:
      - .:/app
      - /app/.next
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
