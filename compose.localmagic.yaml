# compose.localmagic.yaml — the optimistic local-cache branch, up on its own so
# magic sync can be watched on two devices at once: an edit on a phone should
# land in the sidebar and library of a laptop without either waiting on a
# refetch.
#
#   docker compose -f compose.localmagic.yaml up -d --build
#   docker compose -f compose.localmagic.yaml down -v
#
# Its own project name, volume and ports — 5455/3024, the next pair free in
# `docker ps -a` at up time.
#
# 3024 binds to 0.0.0.0 so the demo is reachable from a phone or an iPad.
name: draft-zero-localmagic

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5455:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # `db:seed` is DESTRUCTIVE — it wipes every table before inserting the
  # fixtures. Safe only because the DATABASE_URL below names this stack's own
  # postgres service, backed by this file's own named volume, created empty by
  # `up`. Not devpg (5432), not the base stack (5433).
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Empty on purpose: this slice is story metadata moving between devices,
      # which the offline mock serves as well as a real provider would, and
      # nothing here is billed.
      OPENROUTER_API_KEY: ""
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3024:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # The same branch, built. `next dev` disables Link prefetching outright and
  # pays a compile tax on every navigation, which is most of what a switch
  # between two stories costs on :3024 — so judging whether this feels instant
  # has to happen here. Same database as the dev service, deliberately: the two
  # ports are two builds of one stack, not two stacks.
  #
  # No bind mount, so it serves the code as it was at image build time:
  #   docker compose -f compose.localmagic.yaml up -d --build app-prod
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      OPENROUTER_API_KEY: ""
    ports:
      - "0.0.0.0:3025:3000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
