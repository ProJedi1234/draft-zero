# compose.modelswitch.yaml — the fix-model-switch-delay branch, up on its own so
# the picker can be exercised beside whatever else is running on this box.
#
#   docker compose -f compose.modelswitch.yaml up -d --build
#   docker compose -f compose.modelswitch.yaml down
#
# Its own project name, volume and ports: `draft-zero` (5433/3000),
# `draft-zero-composer` (5435/3003) and `draft-zero-images` (5437/3005) already
# exist on argos, and a stack sharing any of them would take one over rather
# than sit alongside.
#
# 3006 binds to 0.0.0.0 — the bug this branch fixes is a timing one, and it
# looks different on a phone over wifi than on localhost.
name: draft-zero-modelswitch

services:
  postgres:
    # 18, not the base stack's 17: this database is a COPY of devpg, and devpg
    # runs 18 — a 17 server cannot read an 18 dump.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      # /var/lib/postgresql, NOT .../data — the 18 image refuses a mount at the
      # data directory itself.
      - postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # The real key, read from the main checkout rather than copied into this
    # file or typed on a command line. Provider resolution is the other half of
    # what this branch touches, and it only means anything against the live
    # endpoint list.
    #
    # OPENROUTER_API_KEY is deliberately ABSENT from `environment:` below —
    # `environment` outranks `env_file`, so even an empty one there would shadow
    # the real key and drop generation to the offline mock, which reads as a bug
    # in the feature rather than a config mistake.
    env_file:
      - /home/adityadhar/repos/draft-zero/.env.local
    environment:
      # Stated here precisely BECAUSE environment outranks env_file: that file
      # also carries a DATABASE_URL, and it points at the shared devpg. This
      # line is what guarantees the app talks to the copy in this network and
      # never to the instance with no backups.
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3006:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-18:
