# compose.yaml — a self-contained dev stack. Credentials here are deliberately
# hardcoded and deliberately weak: this file describes a throwaway local
# database, never anything reachable off this box. `ports` binds to 127.0.0.1
# so nothing on olympus.lan can reach it either.
#
#   docker compose up -d                 # Postgres only (the usual case)
#   bun run db:migrate && bun run dev    # ...with the app on the host
#
#   docker compose --profile app up      # everything: migrate, then the app
#   docker compose run --rm migrate      # just apply pending migrations
#
# Port 5433, not 5432: the shared `devpg` container already owns 5432 on argos,
# and this stack is meant to coexist with it rather than replace it.

# Pinned so the project name comes from the app, not from the directory — git
# worktrees live in directories named after the branch, and without this each
# one would get its own network, containers and (empty) data volume.
name: draft-zero

services:
  postgres:
    # 17, matching clio in prod — see the README's database table. devpg is 18;
    # generating migrations against the older target keeps both usable.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d is required: without it pg_isready checks the `postgres` database,
      # which does not exist for this role, and reports the server as down.
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: applies pending migrations and exits. `app` waits for it to exit 0,
  # so `--profile app up` can never serve a stale schema. Deliberately a separate
  # service rather than part of the app's startup command — `app` restarts
  # unless-stopped, and a failing migration folded into that command would replay
  # on every restart, burying the error in dev-server output instead of stopping.
  #
  # Also usable on its own, for the host-dev path or without a host toolchain.
  # `run` ignores profiles, so no --profile flag is needed:
  #
  #   docker compose run --rm migrate
  #
  migrate:
    # In `app` so it runs as part of the full stack, and in `migrate` so
    # `--profile migrate up` brings up Postgres and migrates without the app.
    profiles: [app, migrate]
    build:
      context: .
      dockerfile: Dockerfile.dev
    # A one-shot must not come back after it exits 0; the default would be fine
    # here but is stated so it survives a future top-level default.
    restart: "no"
    environment:
      # Same in-network URL as `app` — see the note there. This also shadows the
      # bind-mounted .env.local, which points at the host's devpg on 5432:
      # drizzle.config.ts prefers process.env.DATABASE_URL over the file, so the
      # container's own Postgres wins. Migrating the wrong database is the
      # failure mode if that precedence ever flips.
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      # Load-bearing, not just for parity with `app`: migrations live in
      # ./drizzle, so without the bind mount every `db:generate` would need a
      # --build before it could be applied.
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # Opt-in — `docker compose up` alone stays Postgres-only, since running the
  # dev server on the host gives faster HMR and a working editor toolchain.
  app:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # `postgres`, not 127.0.0.1: inside the network the service name resolves
      # to the container, and the port is the container's own 5432, not 5433.
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Passed through when set on the host, empty otherwise — an empty key
      # makes generation fall back to the offline mock provider.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Bind-mounted source over a container filesystem defeats inotify, so
      # Next's watcher has to poll to see host edits.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Anonymous volumes that shadow the bind mount: the host's node_modules is
      # built for the host's libc and Next's binaries are platform-specific, so
      # the container keeps its own. .next likewise stays container-local so the
      # two dev servers cannot corrupt each other's build cache.
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      # Blocks on a clean exit, so a failed migration stops the stack here
      # rather than letting `next dev` start against a stale schema.
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
