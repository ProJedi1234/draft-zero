# compose.themeengine.yaml — the dynamic story-tint branch, up on its own so the
# atmosphere can be judged on a real screen (and a real phone) rather than in a
# mockup.
#
#   docker compose -f compose.themeengine.yaml up -d --build
#   docker compose -f compose.themeengine.yaml down -v
#
# Its own project name, volume and ports. `docker ps -a` is the register and the
# only trustworthy one — several stacks in the historical allocation (up to
# draft-zero-focusmode, 5449/3018) are gone entirely, and 5450/3019 was verified
# free at `up` time rather than inferred from that list.
#
# 3019 binds to 0.0.0.0 so the demo is reachable from a phone or an iPad, which
# matters more here than usual: the status-bar tint follows the story's colour
# on iOS, and nothing on a desktop browser shows that.
name: draft-zero-themeengine

services:
  postgres:
    # 17, matching the base stack: this database is seeded from the repo's own
    # mock fixtures, not copied from devpg, so there is no 18 dump to read.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # The demonstration data, and on this branch it is the demonstration itself:
  # the five mock stories now carry tints (lagoon, abyss, amber, ember, and one
  # deliberately untinted), so switching stories in the rail is what shows the
  # feature. Seeding is DESTRUCTIVE — it wipes every table first — which is safe
  # here and nowhere else: the DATABASE_URL below names this stack's own
  # postgres service, backed by this file's own named volume, created empty by
  # `up`. It is not devpg (5432) and not the base stack (5433).
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Deliberately empty: an empty key drops generation to the offline mock.
      # The tint is a pure-CSS consequence of two numbers on the story row —
      # nothing about it needs a model, and the mock still streams passages, so
      # the ambient glow can be watched while prose lands.
      OPENROUTER_API_KEY: ""
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3019:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
