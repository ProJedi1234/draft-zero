# compose.imageusage.yaml — the usage-split branch (PR #128), up on its own so
# the picture/prose ledger split can be read over a COPY of devpg's real spend.
#
#   docker compose -f compose.imageusage.yaml up -d postgres   # then restore
#   docker compose -f compose.imageusage.yaml up -d --build
#   docker compose -f compose.imageusage.yaml down
#
# Reuses the 5437/3005 pair freed when draft-zero-images merged (2026-08-27).
name: draft-zero-imageusage

services:
  postgres:
    # 18, not the base stack's 17: this database is a COPY of devpg, and devpg
    # runs 18.x — a 17 server cannot read an 18 dump's newer catalog features.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      # /var/lib/postgresql, NOT .../data — the 18 image refuses a mount at the
      # data directory itself.
      - postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # Empty ON PURPOSE, and in `environment` so nothing can outrank it: this
      # branch only READS the copied ledger, so generation drops to the offline
      # mock and nothing is billed while poking at the page.
      OPENROUTER_API_KEY: ""
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3005:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-18:
