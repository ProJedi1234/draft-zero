# compose.mcp.yaml — the MCP-server branch, up on its own so an MCP client on
# another machine can connect to /api/mcp and drive a story.
#
#   docker compose -f compose.mcp.yaml up -d --build
#   docker compose -f compose.mcp.yaml down -v
#
# Its own project name, volume and ports. `docker ps -a` is the register and it
# is the only trustworthy one — 5437/3005 were free at `up` time (freed again
# when magiccomposer merged). Check again rather than trusting this comment.
#
# 3005 binds to 0.0.0.0 so the MCP endpoint is reachable from the Mac:
#   http://argos.olympus.lan:3005/api/mcp
name: draft-zero-mcp

services:
  postgres:
    # 17, matching the base stack: seeded from mock fixtures, not a devpg dump.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # `db:seed` is DESTRUCTIVE and safe only here: the DATABASE_URL names this
  # stack's own postgres, created empty by `up` — not devpg, not the base stack.
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Deliberately empty: generation drops to the offline mock. The MCP tools
      # read and write the DB directly — nothing here calls a model.
      OPENROUTER_API_KEY: ""
      WATCHPACK_POLLING: "true"
      # The endpoint is published on 0.0.0.0, so /api/mcp's DNS-rebinding guard
      # needs the LAN names it is actually reached on beside localhost.
      MCP_ALLOWED_HOSTS: "argos,argos.olympus.lan"
    ports:
      - "0.0.0.0:3005:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
