# compose.autotint.yaml — the auto-tint stack (PRs #114–#116), up on its own so
# the atmosphere picker can be exercised beside whatever else runs on this box.
#
#   docker compose -f compose.autotint.yaml up -d --build
#   docker compose -f compose.autotint.yaml down -v
#
# Its own project name, volume and ports. `docker ps -a` is the register and it
# is the only trustworthy one — allocations through `draft-zero-themeengine`
# (5450/3019) at the time of writing; this stack takes 5451/3020. Check at `up`
# time rather than trusting this list.
#
# 3020 binds to 0.0.0.0 so the demo is reachable from a phone or an iPad.
name: draft-zero-autotint

services:
  postgres:
    # 17, matching the base stack: seeded from the repo's own mock fixtures,
    # not copied from devpg.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5451:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # The demonstration data. `db:seed` is DESTRUCTIVE — safe here and nowhere
  # else: the DATABASE_URL names this stack's own postgres service, backed by
  # this file's own named volume, created empty by `up`. Not devpg (5432), not
  # the base stack (5433).
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # The real OpenRouter key, which this stack genuinely needs: the atmosphere
    # picker is exactly the kind of thing the offline mock cannot stand in for —
    # without a key it writes nothing at all, and this branch would look
    # identical to main plus a Settings card.
    env_file:
      - .env.local
    environment:
      # After env_file on purpose — `environment` outranks it, so the file's own
      # DATABASE_URL (which points at a stack from the HOST) cannot win over the
      # in-network address.
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # NOTE for anyone exercising this stack: seeded stories carry no tint and
      # tint_auto defaults on, so the FIRST generated turn on any story should
      # pick a colour a beat after the prose lands. After that the picker waits
      # for ~150 new words (or answers "keep"), so don't expect a change per
      # turn — that restraint is the feature. Pressing a swatch pins the story;
      # the sparkle at the head of the atmosphere row hands it back.
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3020:3000"
    volumes:
      - .:/app
      - /app/.next
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
