# compose.runstatus.yaml — the sidebar run-status branch, up on its own so the
# status marks can be exercised beside whatever else is running on this box.
#
#   docker compose -f compose.runstatus.yaml up -d --build
#   docker compose -f compose.runstatus.yaml down -v
#
# Its own project name, volume and ports. `docker ps` is the register and it is
# the only trustworthy one — the allocated pairs at the time of writing were
# `draft-zero` (5433/3000), `draft-zero-composer` (5435/3003),
# `draft-zero-images` (5437/3005), `draft-zero-modelswitch` (5438/3006),
# `draft-zero-lorebook` (5439/3007), `draft-zero-zdr` (5441/3008),
# `draft-zero-retryprofile` (5440/3010) and `draft-zero-sendspinner`
# (5442/3011), several of which were merely stopped rather than gone. Check at
# `up` time rather than trusting this list.
#
# 3012 binds to 0.0.0.0 so the demo is reachable from a phone or an iPad.
name: draft-zero-runstatus

services:
  postgres:
    # 17, matching the base stack: this database is seeded from the repo's own
    # mock fixtures, not copied from devpg, so there is no 18 dump to read.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # The demonstration data. `db:seed` is DESTRUCTIVE — it wipes every table
  # before inserting the fixtures — which is safe here and nowhere else: the
  # DATABASE_URL below names this stack's own postgres service, backed by this
  # file's own named volume, created empty by `up`. It is not devpg (5432) and
  # not the base stack (5433).
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Deliberately empty: an empty key drops generation to the offline mock,
      # which is what this demo wants. The marks are about a run's lifecycle —
      # started, landed, failed — and the mock has all three without billing.
      OPENROUTER_API_KEY: ""
      # The whole point of this stack. At the mock's own pacing a passage
      # finishes in about two seconds, which is long enough to see a mark
      # appear and far too short to walk away from and come back to. At 140ms
      # a chunk a run lasts the best part of a minute, so switching between
      # stories mid-run — the thing this branch is for — is actually testable.
      MOCK_CHUNK_DELAY_MS: "140"
      MOCK_INITIAL_DELAY_MS: "1200"
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3012:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
