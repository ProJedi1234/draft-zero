# compose.sidebarclick.yaml — the mobile sidebar/inspector branch, up on its own
# so the full-screen sheets can be tapped on a real phone.
#
#   docker compose -f compose.sidebarclick.yaml up -d --build
#   docker compose -f compose.sidebarclick.yaml down -v
#
# Its own project name, volume and ports. `docker ps -a` is the register and it
# is the only trustworthy one — 5445/3014 were free at `up` time here, with the
# base stack (5433/3000) and the images stack (5437/3005) the only ones alive.
#
# 3014 binds to 0.0.0.0 so the demo is reachable from a phone or an iPad, which
# is the only place this branch's change is visible at all.
name: draft-zero-sidebarclick

services:
  postgres:
    # 17, matching the base stack: this database is seeded from the repo's own
    # mock fixtures, not copied from devpg, so there is no 18 dump to read.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5445:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # The demonstration data. `db:seed` is DESTRUCTIVE — it wipes every table
  # before inserting the fixtures — which is safe here and nowhere else: the
  # DATABASE_URL below names this stack's own postgres service, backed by this
  # file's own named volume, created empty by `up`. It is not devpg (5432) and
  # not the base stack (5433). No story is copied from anywhere.
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Chrome and the sidebar, nothing that talks to a model — so no key, and
      # generation drops to the offline mock. Nothing is billed to look at this.
      OPENROUTER_API_KEY: ""
      # What to look at: on a phone, open the sidebar and tap a story — it
      # should take the whole screen and leave on its own. Then the inspector,
      # Model tab, and tap the model picker's search box: the page must not
      # zoom.
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3014:3000"
    volumes:
      - .:/app
      - /app/.next
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
