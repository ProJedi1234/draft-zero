# compose.sendspinner.yaml — the optimistic-send branch, up beside the other
# branch stacks so the composer can be tapped on a phone.
#
#   docker compose -f compose.sendspinner.yaml up -d --build
#   docker compose -f compose.sendspinner.yaml down
#
# Its own project name, volume and ports: 5442/3011 was the next free pair when
# this was brought up (`docker ps` is the register). App on 0.0.0.0 because the
# bug this fixes is a touch one — a thumb covering the button it just changed.
name: draft-zero-sendspinner

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # Empty on purpose: this branch is pure composer UI, so generation drops
      # to the offline mock and nothing is billed to look at a spinner.
      OPENROUTER_API_KEY: ""
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3011:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
