# compose.summary.yaml — the rolling story-summary branch, up on its own so the
# summarizer can be exercised beside whatever else is running on this box.
#
#   docker compose -f compose.summary.yaml up -d --build
#   docker compose -f compose.summary.yaml down -v
#
# Its own project name, volume and ports. `docker ps -a` is the register and it
# is the only trustworthy one — the allocated pairs at the time of writing were
# `draft-zero` (5433/3000), `draft-zero-composer` (5435/3003),
# `draft-zero-images` (5437/3005), `draft-zero-modelswitch` (5438/3006),
# `draft-zero-lorebook` (5439/3007), `draft-zero-zdr` (5441/3008),
# `draft-zero-retryprofile` (5440/3010), `draft-zero-sendspinner` (5442/3011)
# and `draft-zero-runstatus` (5443/3012), several of which were merely stopped
# rather than gone. Check at `up` time rather than trusting this list.
#
# 3013 binds to 0.0.0.0 so the demo is reachable from a phone or an iPad.
name: draft-zero-summary

services:
  postgres:
    # 17, matching the base stack: this database is seeded from the repo's own
    # mock fixtures, not copied from devpg, so there is no 18 dump to read.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draft_zero
      POSTGRES_PASSWORD: draft_zero
      POSTGRES_DB: draft_zero
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft_zero -d draft_zero"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # The demonstration data. `db:seed` is DESTRUCTIVE — it wipes every table
  # before inserting the fixtures — which is safe here and nowhere else: the
  # DATABASE_URL below names this stack's own postgres service, backed by this
  # file's own named volume, created empty by `up`. It is not devpg (5432) and
  # not the base stack (5433). No story is copied from anywhere.
  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
    volumes:
      - .:/app
      - /app/node_modules
    command: ["bun", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # The real OpenRouter key, which this stack genuinely needs: the summarizer
    # is the one thing here that the offline mock cannot stand in for. It writes
    # nothing at all without a key rather than inventing a recap, so on the mock
    # this branch would look identical to main.
    env_file:
      - .env.local
    environment:
      # After env_file on purpose — `environment` outranks it, so the file's own
      # DATABASE_URL (which points at this stack from the HOST, on 5444) cannot
      # win over the in-network address. Migrating or serving the wrong database
      # is the failure mode if that precedence ever flips.
      DATABASE_URL: postgresql://draft_zero:draft_zero@postgres:5432/draft_zero
      # NOTE for anyone exercising this stack: the summarizer only runs once
      # prose has actually fallen out of context, so at the 8192 default a
      # seeded story never reaches it. Drag the inspector's context-window
      # slider down to its 2048 floor on a seeded story and write three or four
      # turns — that pushes the opening over the edge and the recap appears in
      # the context viewer as "Story so far". Nothing here forces that setting,
      # because it belongs to the writer rather than to the deployment.
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:3013:3000"
    volumes:
      - .:/app
      - /app/.next
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
